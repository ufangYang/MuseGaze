<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Muse Interface</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b0d12; color: #e8ecf3; overflow: hidden;
  }
  #ui {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; background: rgba(12,14,20,0.7);
    backdrop-filter: blur(8px); border-bottom: 1px solid #1e2330;
  }
  button {
    font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 10px;
    border: 1px solid #2a3142; background: #1a2030; color: #e8ecf3; cursor: pointer;
  }
  button:hover { background: #232c40; }
  button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button.primary:hover { background: #2f6fe0; }
  #status { font-size: 13px; color: #9aa5b8; }
  #bands {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    display: flex; gap: 10px; align-items: flex-end; height: 180px;
  }
  .band { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 54px; }
  .bar-wrap { width: 34px; height: 140px; background: #161b26; border-radius: 8px;
    display: flex; align-items: flex-end; overflow: hidden; }
  .bar { width: 100%; height: 0%; border-radius: 8px 8px 0 0; transition: height 0.12s linear; }
  .band-label { font-size: 12px; color: #aeb8c9; }
  .band-val { font-size: 11px; color: #6b7488; font-variant-numeric: tabular-nums; }
  canvas { display: block; position: fixed; inset: 0; z-index: 1; }
  #hint { position: fixed; right: 16px; bottom: 16px; z-index: 10; max-width: 300px;
    font-size: 12px; color: #7a8498; text-align: right; line-height: 1.5; }
</style>
</head>
<body>
  <div id="ui">
    <button id="connectBtn" class="primary">Connect Muse</button>
    <button id="simBtn">Simulate (no headset)</button>
    <span id="status">Not connected.</span>
  </div>

  <canvas id="art"></canvas>

  <div id="bands">
    <!-- filled by JS -->
  </div>
  <div id="hint">Put the band on, click Connect, pick your Muse in the Bluetooth dialog.<br>Close your eyes to watch Alpha rise.</div>

<script type="module">
// ============================================================================
//  MY MUSE INTERFACE — a personal base you own. Reuses muse-js for the
//  Bluetooth + EEG plumbing; everything else here is yours to change.
//  Open in Chrome or Edge (Safari/Firefox can't do Web Bluetooth).
// ============================================================================

import { MuseClient } from 'https://esm.sh/muse-js';

// ---- signal config ---------------------------------------------------------
const FS = 256;                 // Muse sample rate (Hz)
const N  = 256;                 // FFT window = 1 second of data
// Band edges in Hz. EDIT HERE if you want different bands.
const BANDS = {
  Delta: [1, 4],
  Theta: [4, 8],
  Alpha: [8, 13],
  Beta:  [13, 30],
  Gamma: [30, 44],
};
// Colour per band (also used to tint the art). EDIT HERE.
const BAND_COLORS = {
  Delta: '#8b5cf6', Theta: '#3b82f6', Alpha: '#22c55e',
  Beta:  '#f59e0b', Gamma: '#ef4444',
};

// ---- per-channel ring buffers (4 EEG electrodes) ---------------------------
const CH = 4;                   // TP9, AF7, AF8, TP10
const buffers = Array.from({ length: CH }, () => new Float32Array(N));
let writePos = 0, filled = 0;

// live smoothed band values (relative power 0..1), shared with the art
const bandVals = {}; for (const k in BANDS) bandVals[k] = 0;
let SMOOTH = 0.15;             // 0 = frozen, 1 = no smoothing. Slider adjusts it.

// ---- Phase 2: preprocess bands into steady 0..1 features -------------------
// Each band is stretched across its own LIVE min..max (adaptive), so a feature
// uses its full range instead of the compressed raw relative-power number.
// This is the "features" layer that will later drive the AI image prompt.
const featureVals = {}; for (const k in BANDS) featureVals[k] = 0;
const fMin = {}, fMax = {};
for (const k in BANDS) { fMin[k] = 1; fMax[k] = 0; }
const NORM_RELAX = 0.0015;      // how fast the live range relaxes back. EDIT HERE.

function toFeatures(bands) {
  const out = {};
  for (const k in bands) {
    const v = bands[k];
    // jump instantly to a new extreme, then relax slowly back toward the signal
    if (v < fMin[k]) fMin[k] = v; else fMin[k] += (v - fMin[k]) * NORM_RELAX;
    if (v > fMax[k]) fMax[k] = v; else fMax[k] += (v - fMax[k]) * NORM_RELAX;
    const range = Math.max(1e-6, fMax[k] - fMin[k]);
    out[k] = Math.min(1, Math.max(0, (v - fMin[k]) / range));
  }
  return out;
}

// ---- Phase 3: turn the strongest bands into a text prompt ------------------
// The two most-active bands become the mood + texture of an image prompt.
// EDIT HERE to change the words each brain state produces.
const PROMPT_WORDS = {
  Delta: { mood: 'deep and dreamlike',  tex: 'heavy flowing shapes',  col: 'deep indigo and violet' },
  Theta: { mood: 'calm and drifting',   tex: 'soft misty waves',      col: 'blue and teal' },
  Alpha: { mood: 'serene and glowing',  tex: 'smooth flowing curves', col: 'green and warm gold' },
  Beta:  { mood: 'alert and electric',  tex: 'sharp bright lines',    col: 'amber and orange' },
  Gamma: { mood: 'intense and radiant', tex: 'crystalline bursts',    col: 'vivid red and white' },
};
function buildPrompt(features) {
  const sorted = Object.entries(features).sort((a, b) => b[1] - a[1]);
  const p = PROMPT_WORDS[sorted[0][0]], s = PROMPT_WORDS[sorted[1][0]];
  return `a ${p.mood} abstract landscape, ${p.tex} with ${s.tex}, ${p.col}, dreamlike, highly detailed`;
}

// ---- build the band bars UI ------------------------------------------------
const bandsEl = document.getElementById('bands');
const barEls = {};
for (const name in BANDS) {
  const wrap = document.createElement('div'); wrap.className = 'band';
  wrap.innerHTML = `<div class="band-val" id="val-${name}">0</div>
    <div class="bar-wrap"><div class="bar" id="bar-${name}"
      style="background:${BAND_COLORS[name]}"></div></div>
    <div class="band-label">${name}</div>`;
  bandsEl.appendChild(wrap);
  barEls[name] = document.getElementById(`bar-${name}`);
}

// ---- features readout panel (top-centre) — the preprocessed 0..100 values --
const featPanel = document.createElement('div');
featPanel.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:16px;font-size:12px;color:#aeb8c9;background:rgba(12,14,20,0.6);padding:8px 14px;border-radius:10px;backdrop-filter:blur(6px);';
for (const k in BANDS) {
  const s = document.createElement('span');
  s.innerHTML = `<b style="color:${BAND_COLORS[k]}">${k}</b> <span id="feat-${k}">0</span>`;
  featPanel.appendChild(s);
}
document.body.appendChild(featPanel);
const featEls = {};
for (const k in BANDS) featEls[k] = document.getElementById(`feat-${k}`);

// ============================================================================
//  Verification + controls: raw EEG scope, LIVE indicator, plot chooser.
//  This is the "is it really my brain?" panel — blink and the wave jumps.
// ============================================================================
let lastPacket = 0;     // stamped in onReading; drives the LIVE light
let PLOT_CH = 1;        // which electrode to plot (0=TP9 1=AF7 2=AF8 3=TP10)

const mon = document.createElement('div');
mon.style.cssText = 'position:fixed;top:64px;left:16px;z-index:10;width:320px;background:rgba(12,14,20,0.72);border:1px solid #1e2330;border-radius:12px;padding:12px;backdrop-filter:blur(6px);font-size:12px;color:#aeb8c9;';
mon.innerHTML = `
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
    <span id="liveDot" style="width:10px;height:10px;border-radius:50%;background:#ef4444;"></span>
    <b id="liveText" style="color:#ef4444;">no data yet</b>
  </div>
  <div style="margin-bottom:6px;color:#7a8498;">Raw EEG — proof it's you. Blink hard and watch it jump:</div>
  <canvas id="scope" width="296" height="90" style="width:296px;height:90px;background:#0b0d12;border-radius:8px;display:block;"></canvas>
  <div style="margin:10px 0 4px;color:#7a8498;">Power spectrum 1–45 Hz — the five bands shaded:</div>
  <canvas id="spec" width="296" height="90" style="width:296px;height:90px;background:#0b0d12;border-radius:8px;display:block;"></canvas>
  <div style="display:flex;gap:10px;align-items:center;margin-top:10px;">
    <label style="width:52px;">Plot</label>
    <select id="chSel" style="flex:1;background:#161b26;color:#e8ecf3;border:1px solid #2a3142;border-radius:6px;padding:3px;">
      <option value="0">TP9 (left ear)</option>
      <option value="1" selected>AF7 (left brow)</option>
      <option value="2">AF8 (right brow)</option>
      <option value="3">TP10 (right ear)</option>
    </select>
  </div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:8px;">
    <label style="width:52px;">Smooth</label>
    <input id="smoothSl" type="range" min="0.02" max="0.5" step="0.01" value="0.15" style="flex:1;">
  </div>`;
document.body.appendChild(mon);
const scope = document.getElementById('scope');
const sctx = scope.getContext('2d');
const spec = document.getElementById('spec');
const spctx = spec.getContext('2d');
const liveDot = document.getElementById('liveDot');
const liveText = document.getElementById('liveText');
document.getElementById('chSel').addEventListener('change', e => PLOT_CH = +e.target.value);
document.getElementById('smoothSl').addEventListener('input', e => SMOOTH = +e.target.value);

// bottom prompt bar (Phase 3: your bands, written as words)
const promptBar = document.createElement('div');
promptBar.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;max-width:70vw;background:rgba(12,14,20,0.72);border:1px solid #1e2330;border-radius:10px;padding:8px 16px;font-size:13px;color:#e8ecf3;text-align:center;';
promptBar.innerHTML = `<span style="color:#7a8498;">prompt from your brain →</span> <span id="promptText">…</span>`;
document.body.appendChild(promptBar);
const promptText = document.getElementById('promptText');
let lastPrompt = 0;

// --- Lab / Clean view toggle: one place for the art, one for the analysis ---
const viewBtn = document.createElement('button');
let labOn = true;
viewBtn.textContent = 'Lab view: ON';
viewBtn.onclick = () => {
  labOn = !labOn;
  viewBtn.textContent = 'Lab view: ' + (labOn ? 'ON' : 'OFF');
  mon.style.display = labOn ? '' : 'none';
  featPanel.style.display = labOn ? 'flex' : 'none';
  bandsEl.style.display = labOn ? 'flex' : 'none';
  promptBar.style.display = labOn ? '' : 'none';
};
document.getElementById('ui').appendChild(viewBtn);

// --- live power spectrum (PSD): frequency on X, power on Y, bands shaded ----
function drawSpectrum() {
  const w = spec.width, h = spec.height, maxHz = 45;
  spctx.clearRect(0, 0, w, h);
  for (const name in BANDS) {                       // shade each band's frequency region
    const [lo, hi] = BANDS[name];
    const x0 = lo / maxHz * w, x1 = Math.min(hi, maxHz) / maxHz * w;
    spctx.fillStyle = BAND_COLORS[name] + '22';
    spctx.fillRect(x0, 0, x1 - x0, h);
  }
  let mx = 1e-9;
  for (let k = 1; k <= maxHz; k++) if (spectrum[k] > mx) mx = spectrum[k];
  for (let k = 1; k <= maxHz; k++) {                // one bar per 1-Hz bin, coloured by band
    let col = '#4b5563';
    for (const name in BANDS) { const [lo, hi] = BANDS[name]; if (k >= lo && k < hi) col = BAND_COLORS[name]; }
    const x = k / maxHz * w, bh = Math.min(1, spectrum[k] / mx) * (h - 4);
    spctx.fillStyle = col;
    spctx.fillRect(x, h - bh, Math.max(1, w / maxHz - 1), bh);
  }
}

function drawScope() {
  const w = scope.width, h = scope.height;
  sctx.clearRect(0, 0, w, h);
  let mx = 1;                                   // auto-scale so it always fills
  for (let i = 0; i < N; i++) { const a = Math.abs(buffers[PLOT_CH][i]); if (a > mx) mx = a; }
  sctx.strokeStyle = '#3b82f6'; sctx.lineWidth = 1;
  sctx.beginPath();
  for (let i = 0; i < N; i++) {
    const v = buffers[PLOT_CH][(writePos + i) % N];
    const x = i / (N - 1) * w;
    const y = h / 2 - (v / mx) * (h / 2 * 0.9);
    i === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
  }
  sctx.stroke();
}

function updateLive() {
  const live = lastPacket > 0 && (performance.now() - lastPacket) < 600;
  liveDot.style.background = live ? '#22c55e' : '#ef4444';
  liveText.textContent = live ? 'LIVE • EEG streaming' : (lastPacket ? 'signal lost' : 'no data yet');
  liveText.style.color = live ? '#22c55e' : '#ef4444';
}

function updatePrompt() {
  const now = performance.now();
  if (now - lastPrompt < 1000) return;         // refresh the words ~1x/second
  lastPrompt = now;
  promptText.textContent = buildPrompt(featureVals);
}

// ---- FFT (iterative radix-2 Cooley-Tukey) ----------------------------------
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { const tr = re[i]; re[i] = re[j]; re[j] = tr;
                 const ti = im[i]; im[i] = im[j]; im[j] = ti; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wlRe = Math.cos(ang), wlIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let wRe = 1, wIm = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = i + k + len / 2;
        const vRe = re[b] * wRe - im[b] * wIm;
        const vIm = re[b] * wIm + im[b] * wRe;
        re[b] = re[a] - vRe; im[b] = im[a] - vIm;
        re[a] += vRe;        im[a] += vIm;
        const nwRe = wRe * wlRe - wIm * wlIm;
        wIm = wRe * wlIm + wIm * wlRe; wRe = nwRe;
      }
    }
  }
}

// ---- turn the latest window into 5 band powers -----------------------------
const hann = new Float32Array(N);
for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));

const spectrum = new Float32Array(N / 2);      // avg power per 1-Hz bin, for the PSD plot

function computeBands() {
  if (filled < N) return null;                 // wait for a full second of data
  const power = {}; for (const k in BANDS) power[k] = 0;
  const acc = new Float32Array(N / 2);
  for (let c = 0; c < CH; c++) {
    const re = new Float32Array(N), im = new Float32Array(N);
    // read ring buffer in time order, remove mean, apply Hann window
    let mean = 0; for (let i = 0; i < N; i++) mean += buffers[c][i]; mean /= N;
    for (let i = 0; i < N; i++) {
      const idx = (writePos + i) % N;
      re[i] = (buffers[c][idx] - mean) * hann[i];
    }
    fft(re, im);
    for (let k = 0; k < N / 2; k++) acc[k] += re[k] * re[k] + im[k] * im[k];  // power spectrum
  }
  for (let k = 0; k < N / 2; k++) spectrum[k] = acc[k] / CH;   // averaged over channels, 1 Hz/bin
  for (const name in BANDS) {
    const [lo, hi] = BANDS[name];
    for (let k = Math.round(lo); k < Math.round(hi); k++) power[name] += spectrum[k];
  }
  let total = 0; for (const k in BANDS) total += power[k];
  if (total <= 0) return null;
  const rel = {}; for (const k in BANDS) rel[k] = power[k] / total;   // 0..1
  return rel;
}

// ---- receive EEG packets from the Muse -------------------------------------
function onReading(r) {
  // r.electrode: 0=TP9 1=AF7 2=AF8 3=TP10 4=AUX ; r.samples: 12 microvolt values
  if (r.electrode > 3) return;
  lastPacket = performance.now();          // stamp: proves data is arriving
  for (let i = 0; i < r.samples.length; i++) {
    buffers[r.electrode][(writePos + i) % N] = r.samples[i];
  }
  // advance the shared write head once per packet-set (use TP10 as the clock)
  if (r.electrode === 3) {
    writePos = (writePos + r.samples.length) % N;
    filled = Math.min(N, filled + r.samples.length);
  }
}

// ---- main loop: compute bands, update bars + art ---------------------------
function tick() {
  const rel = computeBands();
  if (rel) {
    for (const k in BANDS) {
      bandVals[k] += (rel[k] - bandVals[k]) * SMOOTH;
      barEls[k].style.height = Math.min(100, bandVals[k] * 260) + '%';
      document.getElementById(`val-${k}`).textContent = Math.round(bandVals[k] * 100);
    }
    // Phase 2: raw bands -> steady, self-calibrating 0..1 features
    const f = toFeatures(bandVals);
    for (const k in BANDS) {
      featureVals[k] = f[k];
      featEls[k].textContent = Math.round(f[k] * 100);
    }
  }
  drawScope();            // raw EEG waveform (verification)
  drawSpectrum();         // live power spectrum with bands shaded
  updateLive();           // LIVE / no-data light
  updatePrompt();         // Phase 3: bands -> words, ~1x/second
  drawArt(featureVals);   // the art now runs on the preprocessed features
  requestAnimationFrame(tick);
}

// ============================================================================
//  THE ART — this is YOUR canvas. Everything below is meant to be rewritten.
//  bandVals.Alpha / .Beta / .Theta / .Delta / .Gamma are each 0..1, live.
// ============================================================================
const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

let phase = 0;
function drawArt(b) {
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = 'rgba(11,13,18,0.18)';     // trail fade. EDIT HERE.
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  phase += 0.01 + b.Beta * 0.08;              // focus (Beta) speeds it up
  const rings = 5;
  for (let i = 0; i < rings; i++) {
    const t = i / rings;
    const radius = 60 + t * 220 + b.Alpha * 260;   // calm (Alpha) makes it bloom
    const hue = (t * 120 + b.Gamma * 200 + phase * 20) % 360;
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.1; a += 0.1) {
      const wobble = Math.sin(a * 6 + phase * (2 + i)) * (8 + b.Theta * 60);
      const rr = radius + wobble;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${0.5 - t * 0.3})`;
    ctx.lineWidth = 2 + b.Delta * 6;
    ctx.stroke();
  }
}

// ---- connection wiring -----------------------------------------------------
const statusEl = document.getElementById('status');
const setStatus = (t) => statusEl.textContent = t;

document.getElementById('connectBtn').addEventListener('click', async () => {
  try {
    setStatus('Opening Bluetooth dialog… pick your Muse.');
    const client = new MuseClient();
    await client.connect();          // <- triggers the pairing dialog
    await client.start();
    client.eegReadings.subscribe(onReading);
    setStatus('Connected. Streaming live EEG.');
  } catch (e) {
    setStatus('Connection failed: ' + e.message + '  (Use Chrome/Edge, Bluetooth on.)');
  }
});

// Simulation: fake, plausible EEG so you can build the art with no headset.
document.getElementById('simBtn').addEventListener('click', () => {
  setStatus('Simulating fake EEG (no headset).');
  let phi = 0;
  setInterval(() => {
    phi += 0.05;
    const samples = [];
    for (let i = 0; i < 12; i++) {
      const alpha = Math.sin(2 * Math.PI * 10 * (phi + i / FS)) * (20 + 15 * Math.sin(phi / 3));
      const beta  = Math.sin(2 * Math.PI * 20 * (phi + i / FS)) * 8;
      const noise = (Math.sin(phi * 7 + i) + Math.sin(phi * 13 + i * 2)) * 5;
      samples.push(alpha + beta + noise);
    }
    for (let c = 0; c < CH; c++) onReading({ electrode: c, samples });
  }, 1000 / (FS / 12));   // ~one packet-set per 12 samples
});

tick();   // start the render loop immediately (bars sit at 0 until data flows)
</script>
</body>
</html>
