<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MuseGaze — Visualiser</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #05060a; color: #e8ecf3; overflow: hidden; }
  #ui { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: rgba(8,10,16,0.5); backdrop-filter: blur(10px); border-bottom: 1px solid #141824; transition: opacity .4s; }
  body.present #ui { opacity: 0; pointer-events: none; }
  button { font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px; border: 1px solid #2a3142; background: #141a28; color: #e8ecf3; cursor: pointer; }
  button:hover { background: #1e2740; }
  #modes { display: flex; background: #10131d; border: 1px solid #222a3a; border-radius: 10px; overflow: hidden; }
  #modes button { border: 0; border-radius: 0; background: transparent; padding: 8px 16px; }
  #modes button.on { background: #3b82f6; color: #fff; }
  #status { font-size: 13px; }
  .spacer { flex: 1; }
  #heart { display:flex; align-items:center; gap:6px; font-size:13px; color:#9aa5b8; font-variant-numeric:tabular-nums; }
  #heart .hh { color:#ef4444; font-size:16px; transition:transform .05s; display:inline-block; }
  a.link, button.link { font-size:13px; color:#e8ecf3; text-decoration:none; border:1px solid #3b82f6; background:#3b82f6; padding:8px 12px; border-radius:10px; cursor:pointer; }
  canvas { display: block; position: fixed; inset: 0; z-index: 1; }
  .scenelayer { position: fixed; inset: 0; z-index: 1; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.8s ease; will-change: opacity, transform; }
  #wait { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; color: #6b7488; pointer-events: none; }
  #wait.hide { display: none; }
  #wait b { color: #aeb8c9; font-size: 20px; font-weight: 600; }
  #wait span { font-size: 14px; }
</style>
</head>
<body>
  <div id="ui">
    <div id="modes">
      <button data-mode="flower" class="on">Flower</button>
      <button data-mode="neural">Neural</button>
      <button data-mode="scenes">Scenes</button>
    </div>
    <span id="status">Waiting for Control…</span>
    <div class="spacer"></div>
    <div id="heart" title="Heart rate from Control"><span class="hh">♥</span><span id="bpm">--</span> bpm</div>
    <button id="presentBtn" class="link">Present ⛶</button>
    <a class="link" href="./control.html" target="_blank" rel="noopener">Open Control ▸</a>
  </div>
  <div id="scA" class="scenelayer"></div>
  <div id="scB" class="scenelayer"></div>
  <canvas id="art"></canvas>
  <div id="wait">
    <b>Waiting for the Control window</b>
    <span>Open Control ▸, click Connect Muse (or Simulate) there — this screen renders it live.</span>
  </div>

<script type="module">
// ============================================================================
//  MuseGaze — VISUALISER. Pure receiver. Control holds the Muse and broadcasts
//  the live features (bands + asymmetry + HRV + complexity) over a same-browser
//  channel. Bands drive the form; frontal alpha ASYMMETRY warms/cools the
//  palette (approach = warm); the heartbeat breathes it. Put this on the
//  presentation screen; press Present ⛶ for fullscreen.
// ============================================================================
const bus = new BroadcastChannel('musegaze');
const BANDS = ['Delta','Theta','Alpha','Beta','Gamma'];
const BAND_HUE = { Delta:265, Theta:217, Alpha:142, Beta:38, Gamma:0 };
const F = { Delta:0,Theta:0,Alpha:0,Beta:0,Gamma:0, FAA:0.5, TB:0.5, HRV:0.5, LZ:0.5 };
let bpm=0, pulse=0, lastRx=-1e9, curState='Neutral';
// routing: which feature drives each knob (set on Control, sent here). Defaults match the old hardwiring.
let route={ size:'Alpha', speed:'Beta', ripple:'Theta', warmth:'FAA', glow:'HRV' };
bus.onmessage = (e) => { const m=e.data; if(!m||!m.f) return;
  for (const k in m.f) if (typeof m.f[k]==='number') F[k]=m.f[k];
  if (m.map) route=m.map;
  if (m.state) curState=m.state;
  bpm=m.bpm||0; if(m.pulse>pulse) pulse=m.pulse; lastRx=performance.now(); };
function dominant(){ return BANDS.map(k=>[k,F[k]]).sort((a,b)=>b[1]-a[1]); }
function kv(name){ const k=route[name]; return (k&&k!=='none')?(F[k]||0):0; }   // knob value from its wired feature

const canvas=document.getElementById('art'), ctx=canvas.getContext('2d');
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; } addEventListener('resize',resize); resize();

let phase=0;
function warm(){ return (kv('warmth')-0.5)*70; }  // the feature wired to Warmth shifts the hue
function drawFlower(){
  const w=canvas.width,h=canvas.height; ctx.fillStyle='rgba(5,6,10,0.16)'; ctx.fillRect(0,0,w,h);
  const size=kv('size'), speed=kv('speed'), ripple=kv('ripple'), glow=kv('glow');
  const cx=w/2,cy=h/2; phase+=0.01+speed*0.08; const breath=1+pulse*0.06, rings=5, hoff=warm();
  for (let i=0;i<rings;i++){ const t=i/rings, radius=(60+t*220+size*260)*breath, hue=(t*120+F.Gamma*200+phase*20-hoff+360)%360;
    ctx.beginPath();
    for (let a=0;a<=Math.PI*2+0.1;a+=0.1){ const wob=Math.sin(a*6+phase*(2+i))*(8+ripple*60), rr=radius+wob;
      const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr; a===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.closePath(); ctx.strokeStyle=`hsla(${hue},80%,${60+glow*25}%,${Math.min(0.9,(0.5-t*0.3)*(1+glow*0.7))})`;
    ctx.lineWidth=(2+F.Delta*6)*(1+pulse*0.5); ctx.stroke(); }
}
const NODES=78; let neurons=[], edges=[], travels=[];
function initNeural(){ neurons=[]; edges=[]; const w=innerWidth,h=innerHeight;
  for (let i=0;i<NODES;i++) neurons.push({x:Math.random()*w,y:Math.random()*h,
    vx:(Math.random()-0.5)*0.18,vy:(Math.random()-0.5)*0.18,charge:Math.random(),lit:0,
    hue: 170 + Math.random()*160});                         // each cell its own cyan→violet→magenta hue
  for (let i=0;i<NODES;i++){ const d=neurons.map((n,j)=>({j,r:(n.x-neurons[i].x)**2+(n.y-neurons[i].y)**2})).sort((a,b)=>a.r-b.r);
    for (let k=1;k<=3;k++) if(d[k]) edges.push([i,d[k].j]); } travels=[]; }
function drawNeural(){ const w=canvas.width,h=canvas.height; ctx.fillStyle='rgba(3,5,12,0.20)'; ctx.fillRect(0,0,w,h);
  if(!neurons.length) initNeural();
  ctx.globalCompositeOperation='lighter';                   // additive glow, like real neurons under a scope
  const conn=0.10+F.Alpha*0.5+F.Theta*0.3, warmShift=warm();
  for (const [i,j] of edges){ const a=neurons[i],c=neurons[j];
    const g=ctx.createLinearGradient(a.x,a.y,c.x,c.y);
    g.addColorStop(0,`hsla(${(a.hue-warmShift+360)%360},85%,62%,${conn*0.45})`);
    g.addColorStop(1,`hsla(${(c.hue-warmShift+360)%360},85%,62%,${conn*0.45})`);
    ctx.strokeStyle=g; ctx.lineWidth=1+F.Beta; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(c.x,c.y); ctx.stroke(); }
  const speed=0.015+F.Gamma*0.06+F.Beta*0.03;
  for (const t of travels){ t.t+=speed; const a=neurons[t.i],c=neurons[t.j]; const x=a.x+(c.x-a.x)*t.t,y=a.y+(c.y-a.y)*t.t;
    ctx.fillStyle=`hsla(38,100%,72%,0.95)`;                   // warm gold action-potential sparks for contrast
    ctx.beginPath(); ctx.arc(x,y,2.4+F.Gamma*3,0,Math.PI*2); ctx.fill(); if(t.t>=1) neurons[t.j].charge+=0.35; }
  travels=travels.filter(t=>t.t<1); const fire=0.006+F.Beta*0.03+F.Gamma*0.05;
  for (let i=0;i<neurons.length;i++){ const n=neurons[i]; n.x+=n.vx; n.y+=n.vy;
    if(n.x<0||n.x>w)n.vx*=-1; if(n.y<0||n.y>h)n.vy*=-1; n.charge+=fire; n.lit*=0.90;
    if(n.charge>=1){ n.charge=0; n.lit=1; for(const [a,c] of edges) if(a===i) travels.push({i:a,j:c,t:0}); }
    const r=(3+n.lit*11)*(1+pulse*0.5), hh=(n.hue-warmShift+360)%360;
    const rg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.3);   // soft glowing soma
    rg.addColorStop(0,`hsla(${hh},100%,${72+n.lit*25}%,${0.65+n.lit*0.35})`);
    rg.addColorStop(0.5,`hsla(${hh},95%,60%,${0.18+n.lit*0.3})`);
    rg.addColorStop(1,`hsla(${hh},90%,50%,0)`);
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(n.x,n.y,r*2.3,0,Math.PI*2); ctx.fill(); }
  ctx.globalCompositeOperation='source-over';
}

// ---- Scenes mode: pre-made cinematic images; your brain state cross-fades between them.
//  Pre-generated offline (see gen_scenes.py) -> no live generation, no WiFi during use.
const SCENES={ odyssey:'./odyssey.png', mobydick:'./mobydick.png', wonderland:'./wonderland.png', alice:'./alice.png' };
for(const k in SCENES){ const im=new Image(); im.src=SCENES[k]; }        // preload + browser-cache
const scA=document.getElementById('scA'), scB=document.getElementById('scB');
let scFront=scB, scBack=scA, curScene='', lastSceneT=-1e9;
function showSceneLayers(on){ scA.style.display=on?'block':'none'; scB.style.display=on?'block':'none'; }
showSceneLayers(false);
// scene follows the CLASSIFIED brain state, not a raw band — so the picture actually means something.
const STATE_SCENE={ Relaxed:'wonderland', Drowsy:'alice', Focused:'odyssey', Excited:'mobydick', Neutral:'wonderland' };
function sceneFor(){ return STATE_SCENE[curState] || 'odyssey'; }
function crossfadeTo(name){ scBack.style.backgroundImage=`url("${SCENES[name]}")`;
  scBack.style.opacity=1; scFront.style.opacity=0; [scFront,scBack]=[scBack,scFront]; curScene=name; }

let mode='flower'; const modeBox=document.getElementById('modes');
modeBox.addEventListener('click', e => { const btn=e.target.closest('button'); if(!btn) return;
  mode=btn.dataset.mode; [...modeBox.children].forEach(c=>c.classList.toggle('on',c===btn));
  ctx.fillStyle='#05060a'; ctx.fillRect(0,0,canvas.width,canvas.height); if(mode==='neural') initNeural();
  const sc=(mode==='scenes'); showSceneLayers(sc); canvas.style.display=sc?'none':'block'; if(sc) lastSceneT=-1e9; });

const statusEl=document.getElementById('status'), bpmEl=document.getElementById('bpm'), heartGlyph=document.querySelector('#heart .hh'), waitEl=document.getElementById('wait');
function tick(){ const rx=performance.now()-lastRx<3000; pulse*=0.90; heartGlyph.style.transform=`scale(${1+pulse*0.5})`;
  if(mode==='flower') drawFlower();
  else if(mode==='neural') drawNeural();
  else if(mode==='scenes'){ const now=performance.now();
    if(now-lastSceneT>4500){ const s=sceneFor(); if(s!==curScene) crossfadeTo(s); lastSceneT=now; }
    scFront.style.transform=`scale(${1.04+pulse*0.03})`; }
  statusEl.textContent = rx?('Receiving ✓ · '+curState):'Waiting for Control…'; statusEl.style.color=rx?'#22c55e':'#8b95a8';
  bpmEl.textContent=bpm?bpm:'--'; waitEl.classList.toggle('hide',rx); requestAnimationFrame(tick); }

document.getElementById('presentBtn').addEventListener('click', () => {
  document.body.classList.toggle('present');
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); });

window.__muse = { bus, F, state: () => ({ lastRx, bpm }) };
tick();
</script>
</body>
</html>
